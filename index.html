    var GENERAL = [
      { title: 'Introducción', blocks: [
        { t: 'p', text: 'Crea un rol para tu personaje, cíñete a él y empieza tu nueva vida en la ciudad. No están permitidos los roles terroristas, acosadores, racistas, machistas ni de contenido +18 sin consentimiento. Evita cualquier rol que pueda ofender OOC a otra persona.' },

        { t: 'p', text: 'Actúa en cada situación como lo harías en la vida real, pero respetando siempre la normativa. Cualquier conducta fuera de lo normal podrá ser sancionada. Evita comportamientos y temas que puedan ofender a otras personas (política, ideología, etc.).' },
        { t: 'p', text: 'Los administradores se reservan en todo momento el derecho a considerar indebidos ciertos comportamientos aunque no estén recogidos en la normativa. Usad el sentido común.' },

        { t: 'note', text: 'La normativa evolucionará junto con el servidor, así que conviene leerla periódicamente. Cualquier cambio se comunicará antes por Discord.' }
      ] },
      { title: 'Conceptos generales', blocks: [

          { k: 'MetaGaming (MG)', v: 'Usar dentro del juego información obtenida fuera de él, a propósito o por error. Está prohibido y se sanciona. Las sospechas que no se expliquen de forma convincente al staff también serán sancionadas.' },
          { k: 'PowerGaming (PG)', v: 'Hacer cosas que en la vida real no podrían hacerse por no tener lógica o ser imposibles, o forzar el rol de otro jugador sin darle opción a reaccionar. En persecuciones solo se podrá huir por la montaña con vehículos todoterreno y por caminos de tierra.' },
          { k: 'Ejemplos de PG', v: 'Hablar por radio esposado, meterse en un arbusto para aprovechar la tercera persona o disparar desde él, saltar desde grandes alturas, reconocer a alguien por la voz tras un rol enmascarado, el Ghost Peek (disparar desde ángulos muertos) y hacer volteretas mientras se apunta.' },

          { k: '/me', v: 'Comando para mostrar a los demás una acción de tu personaje que no se puede animar.' },
          { k: '/do', v: 'Comando narrativo o de entorno para reforzar el rol: apariencia, estado del personaje o lo que le rodea.' },
          { k: 'Rol de entorno', v: 'Todo lo que nos rodea y debemos simular. La ciudad simula ser real: hay ciudadanos y cámaras que ven lo que hacemos. Al cometer un delito en una zona concurrida, debemos avisar nosotros mismos a la policía con /911 o /entorno; tanto el atracador como el atracado. En zonas como la base militar, el aeropuerto, la comisaría, el hospital y los barrios el rol de entorno es mayor y hay que reaccionar en consecuencia.' },
          { k: 'Trabajos con WL', v: 'Todo trabajo con jefe se considera con whitelist (negocios, bandas, EMS, etc.). Está totalmente prohibido cambiarse temporalmente a un trabajo sin WL para farmear dinero.' },
          { k: 'Cámaras de seguridad', v: 'Solo se pueden rolear las cámaras de un trabajo con whitelist. Están prohibidas las cámaras corporales, GoPros o similares. Las únicas cámaras móviles son las frontales de los coches patrulla, y se puede rolear su destrucción con un /me. Todas las grabaciones son mudas, salvo la lectura de derechos en una detención.' }
        ] }
      ] },
      { title: 'Normas generales', blocks: [
        { t: 'kv', items: [
          { k: 'Valora tu vida', v: 'Prioriza siempre la supervivencia de tu personaje. Es la norma más importante y no cumplirla conlleva sanción.' },
          { k: 'Evadir rol', v: 'Prohibido evitar un rol o dejarlo a medias huyendo o desconectándote. Si hace falta, se pueden pedir aclaraciones. También es evadir rol meterse en zonas seguras durante un rol agresivo o pulsar la «E» antes de que termine el tiempo de desangre.' },
          { k: 'Volver al rol', v: 'No se puede retomar un rol después de un PK ni después de haberse alejado de la zona.' },
          { k: 'Forzar rol', v: 'Buscar una y otra vez a una persona para iniciar un rol con ella. Si no te acepta, debes marcharte.' },
          { k: 'Rol ajeno', v: 'Prohibido interferir en un rol en el que no estás implicado. Puedes intervenir si no interrumpes su desarrollo y hay rol previo.' },
          { k: 'Detener un rol', v: 'No se para un rol para reportar ni por ningún otro motivo: primero se termina y después se actúa si es necesario. La administración puede cortarlo si lo ve necesario para que no empeore la situación.' },
          { k: 'Uso de armas', v: 'Para usar la violencia o un arma siempre debe haber rol previo, salvo en sedes de bandas y zonas ilegales. Si amenazas a alguien, dale tiempo suficiente para reaccionar antes de disparar.' },
          { k: 'Francotiradores', v: 'En cualquier rol agresivo solo una persona del grupo puede llevar un francotirador (normal, WWII, AWK, SKS, etc.), salvo en los atracos donde se permiten 2 tiradores.' },
          { k: 'Armas largas', v: 'Son armas largas los francotiradores, fusiles y escopetas. Para llevar un arma larga o un arma cuerpo a cuerpo de dos manos hace falta mochila. Las armas largas y las automáticas cortas están limitadas a 1 por persona.' },
          { k: 'Armas en vehículos', v: 'El conductor no puede disparar con el vehículo en movimiento; los pasajeros sí. En helicóptero solo disparan los pasajeros, y un francotirador solo se puede usar con el helicóptero totalmente estabilizado y quieto.' },
          { k: 'Helicóptero policial', v: 'La policía puede disparar a matar desde el helicóptero si le han disparado y no está sobre el núcleo urbano.' },
          { k: 'Roles desde vehículos', v: 'No se puede iniciar un rol agresivo desde dentro de un vehículo (salvo eventos autorizados): hay que bajarse. En persecuciones no se dispara a matar, solo a las ruedas; para disparar a matar hay que bajarse del vehículo.' },
          { k: 'Estado de coma', v: 'Es el estado del personaje cuando muere. Simular inconsciencia se hace con /do, de forma temporal y nunca para evadir un rol.' },
          { k: 'Llamadas a servicios', v: 'Prohibido hacer llamadas falsas a EMS, mecánicos o policía. Siempre hay que escribir el motivo de la llamada.' },
          { k: 'Trabajos legales', v: 'Quien esté haciendo un trabajo legal no puede ser extorsionado ni robado. No se puede robar el armamento a los policías. Prohibido usar la ropa o los vehículos de trabajo para cosas ajenas al trabajo.' },
          { k: 'Reportar infracciones', v: 'Termina siempre el rol antes de reportar, y solo reporta después de haber intentado aclarar la situación por OOC o Discord.' },
          { k: 'Ropa de servicios', v: 'Prohibido usar uniformes de policía, mecánicos o EMS comprados en la tienda.' },
          { k: 'Rotación de rol', v: 'Tras la muerte de un personaje hay que rotar el rol: cambiar perfil y aspecto físico (solo se puede mantener el sexo). Los jefes y subjefes de facción deben pedir permiso para rotar, y para pasar a un rol contrario deben hacerse un CK. Hay que esperar al menos 30 días para volver a un rol similar.' },
          { k: 'DNI', v: 'Todos los ciudadanos deben llevar su identificación y no se puede rolear una falsa. Un policía al que se le pida el DNI puede dar su número de placa; si se registra a un policía muerto o se le amenaza, tendrá que mostrarlo.' },
          { k: 'Máscaras', v: 'Llevar máscara no te hace irreconocible: se te puede investigar por matrícula, ropa y vehículos, pero nunca por la voz. Ver a alguien vestido igual no garantiza que sea la misma persona.' },
          { k: 'Cuerpos calcinados', v: 'No se puede interactuar con un cuerpo calcinado.' },
          { k: 'Software externo', v: 'Prohibido cualquier software externo que no sea para grabar: cheats, autoclicks, etc. Los moduladores de voz solo se permiten si encajan con tu IDP.' },
          { k: 'Puntos calientes y armas', v: 'PROHIBIDO regalar puntos calientes o armamento. Solo las bandas pueden venderlos, nunca por debajo de 500.000 $.' },
          { k: 'Faltas de respeto', v: 'Las faltas de respeto OOC se sancionan. Dentro del rol se puede usar lenguaje ofensivo si la situación lo pide, pero con control y sentido común.' },
          { k: 'Eventos', v: 'Durante los eventos organizados por el staff no se puede delinquir en toda la ciudad.' },
          { k: 'Uso de OOC', v: 'Todo lo que ocurre en el servidor es IC. El chat OOC solo se usa para preguntar si hay policía disponible o resolver dudas de comandos y teclas, salvo que un administrador indique lo contrario.' },
          { k: '/calladmin y /report', v: 'Deben explicar el problema con detalle. No se atenderán los que no lo especifiquen.' },
          { k: 'Bindeos', v: 'Prohibido usar bindeos para poner bridas o cortar comunicaciones. La policía usa las esposas y las bandas, igual. Para cortar las comunicaciones hay que quitar el móvil y la radio; al no existir otros dispositivos, con eso quedan cortadas TODAS.' },
          { k: 'Menús', v: 'Un jugador que está en un menú de interacción (garaje, tienda, etc.) no puede entrar en un rol agresivo.' }
        ] }
      ] },
      { title: 'Tráfico y vehículos', blocks: [
        { t: 'h', text: 'Vehículos' },
        { t: 'ul', items: [
          'Los accidentes se rolean como en la vida real.',
          'No se puede conducir con dos o más ruedas pinchadas. Con una sola rueda pinchada no se pueden superar los 100 km/h.',
          'Si te pinchan una rueda de un disparo, puedes circular hasta que la rueda empiece a deslizar.'
        ] },
        { t: 'h', text: 'Aeronaves' },
        { t: 'ul', items: [
          'Todos los pilotos necesitan la licencia del tipo de aeronave que pilotan.',
          'Está prohibido robar aeronaves.',
          'Una aeronave puede volar como máximo 30 minutos antes de repostar.',
          'Hay que volar a un mínimo de 200 m de altitud y está prohibido sobrevolar el núcleo urbano, salvo exhibiciones, cuerpos de seguridad y EMS.',
          'Solo se puede aterrizar en pistas, helipuertos o llanos de montaña, salvo exhibiciones, cuerpos de seguridad y EMS.'
        ] },
        { t: 'h', text: 'Embarcaciones' },
        { t: 'ul', items: [
          'Para pilotar una embarcación hace falta el título teórico y práctico de patrón.',
          'La tasa de alcohol permitida para un patrón es de 0,0 g/l.',
          'Las embarcaciones se pueden amarrar en cualquier puerto autorizado de la ciudad.',
          'La velocidad máxima en zonas costeras es de 20 nudos (37 km/h).',
          'Toda embarcación matriculada en la ciudad debe pasar al menos una inspección al año.',
          'Nunca se puede echar el ancla a menos de 200 m de una playa.',
          'Están prohibidas las acrobacias cerca de la costa, salvo en exhibiciones.'
        ] }
      ] },
      { title: 'Tipos de CK', blocks: [
        { t: 'kv', items: [
          { k: 'Cadena perpetua', v: 'Se aplica si el detenido llega a comisaría con más de 200.000 $ en multas. Tendrá hasta 30 minutos para pagar la mitad de las multas que elija, reduciendo la deuda al 50 % y por debajo de 200.000 $.' },
          { k: 'Organización ilegal → Policía', v: 'Se puede hacer CK a un miembro de la policía o de su escala directiva si hay una investigación y un rol detrás que demuestren que la supervivencia de la banda está en riesgo. Debe aprobarlo antes la administración.' },
          { k: 'Organización ilegal → Civil', v: 'Una banda puede hacer CK a un civil si hay rol detrás y este ha comprometido de alguna forma la estabilidad de la organización.' },
          { k: 'Pruebas necesarias', v: 'En ambos casos, la organización debe presentar por ticket de Discord una foto del aspecto y la cara, el documento de identidad, si pertenece a alguna organización y un motivo de peso redactado y contextualizado. Todo debe estar justificado con imágenes. Para hacer CK al jefe de otra banda hay que hacerlo mediante una guerra.' },
          { k: 'Intrusos y secuestrados', v: 'Si alguien entra en la sede de una organización criminal y le pillan in fraganti, se le puede hacer CK. Si un secuestrado no valora su vida, se le puede hacer un CK in situ no planeado, abriendo ticket antes de que ocurra.' },
          { k: 'CK voluntario', v: 'Se puede pedir como máximo una vez al mes, mediante ticket en Discord.' },
          { k: 'CK administrativo', v: 'Lo decide la administración cuando alguien acumula demasiadas infracciones o se salta una norma grave.' },
          { k: 'CK judicial', v: 'A quien acumule cargos equivalentes a 35 años de prisión se le aplica un CK directo.' }
        ] }
      ] },
      { title: 'Zonas calientes', blocks: [
        { t: 'p', text: 'Son zonas donde se realizan actividades ilegales, como la venta de armas o el blanqueo de dinero.' },
        { t: 'ul', items: [
          'No se pueden campear, salvo las organizaciones autorizadas.',
          'No se pueden enviar entornos ni avisos al EMS, porque el rol de entorno en estas zonas es bajo.',
          'Se puede matar sin previo aviso.',
          'No se pueden ocultar matrículas con /me o /do: para eso están los coches NPC y el eliminador de matrículas.',
          'La policía puede hacer redadas aleatorias, siempre supervisadas por un alto rango.',
          'Prohibido desconectarse en zonas calientes o territorios.'
        ] }
      ] },
      { title: 'Robos y secuestros', blocks: [
        { t: 'h', text: 'Antes de delinquir' },
        { t: 'ul', items: [
          'ANTES de cualquier atraco, secuestro o robo, comprueba que haya policía disponible preguntando por /OOC (como máximo una vez cada 30 minutos). La policía no puede rastrear ese mensaje.',
          'Policía disponible es la que puede atender un rol; policía de servicio es la que está trabajando, esté disponible o no.',
          'El número de policías necesario depende de la jurisdicción en la que estés (Norte o Sur). Los cuerpos de policía pueden colaborar en atracos medianos, grandes y traslados a la federal.',
          'Tras un tiroteo, cada bando recoge como pueda a sus heridos (pueden pulsar la «E» si el rol ha terminado del todo y no tienen cómo ir al hospital). Puede unirse cuanta gente quiera de ambos grupos, siempre que pertenezca a ellos.',
          'Los rehenes que colaboran no pueden ser agredidos. Si se rompen las negociaciones, pueden ser abatidos.',
          'Prohibido llevar cascos de cualquier tipo en roles agresivos como secuestros o badulaques, para ambas partes.',
          'Para matar a un civil tiene que haber 2 policías de servicio. Si el civil no valora su vida, se le puede hacer un PK como castigo inmediato, dejándole siempre margen para responder.'
        ] },
        { t: 'h', text: 'Sobre los robos' },
        { t: 'ul', items: [
          'Se puede robar todo: comida, bebida y armamento militar o policial (todo lo que salga de la armería de comisaría: armas, cargadores y accesorios). Al terminar el rol hay que tirarlo todo.',
          'No se puede robar carne cruda, pescado ni cereales.',
          'No se puede obligar a nadie a sacar dinero de un cajero o de su casa, ni a usar /miregalo.',
          'No se puede campear ninguna zona: esperar a que alguien salga sin darle opción a huir. También es campear ir a sitios conocidos a robar (tienda multiusos, badulaques, etc.).',
          'Prohibido parar un coche en marcha para robar a sus ocupantes: hay que darle el alto. A los jugadores solo se les puede robar de noche, o de día con rol previo. Si están cometiendo un delito o llevan máscara, se les puede robar a cualquier hora.'
        ] },
        { t: 'h', text: 'Sobre los secuestros' },
        { t: 'p', text: 'Hay dos tipos de secuestro: con rescate a la policía y sin rescate.' },
        { t: 'ul', items: [
          'Con rescate: la policía participa en el rol y hay negociación. Se puede usar como moneda de cambio para liberar a un detenido o a alguien a punto de entrar en prisión perpetua.',
          'Sin rescate: lo hacen grupos u organizaciones ilegales para obtener información, ajustar cuentas, hacer un CK, etc. En el momento de raptar al objetivo puede haber como máximo 3 atacantes; una vez raptado, no hay límite de personas.',
          'Un secuestro dura como máximo 45 minutos desde que se establece la posición. El traslado hasta el punto no cuenta.',
          'No se puede usar a amigos como rehenes.',
          'No se puede secuestrar a la misma persona hasta que pase 1 hora y media.',
          'No se puede secuestrar en moto: se considera PG.'
        ] },
        { t: 'h', text: 'Sobre los rescates' },
        { t: 'ul', items: [
          'Hacen falta al menos 3 agentes disponibles y como máximo 5.',
          'Como máximo participan 5 delincuentes.',
          'Puede haber como máximo 3 rehenes por rescate.',
          'Rescate máximo en dinero negro: civil 100.000 $; policía 300.000 $ (alto rango) o 200.000 $ (rango normal o bajo).'
        ] },
        { t: 'h', text: 'Robo a un civil' },
        { t: 'kv', items: [
          { k: 'Atracadores', v: '1 por cada policía de servicio.' },
          { k: 'Policías', v: 'Mínimo 1 de servicio.' },
          { k: 'Repetición', v: 'No se puede atracar a la misma persona hasta que pasen 30 minutos.' }
        ] },
        { t: 'h', text: 'Secuestro a un civil' },
        { t: 'kv', items: [ { k: 'Atracadores', v: 'Máximo 3.' }, { k: 'Policías', v: 'Mínimo 3 de servicio.' }, { k: 'Tiradores', v: 'Ilimitados.' } ] },
        { t: 'h', text: 'Secuestro a un policía' },
        { t: 'kv', items: [ { k: 'Rescate máximo', v: '100.000 $, o 150.000 $ si es un alto cargo.' }, { k: 'Atracadores', v: 'Máximo 5.' }, { k: 'Policías', v: 'Mínimo 3 de servicio (sin contar al secuestrado).' }, { k: 'Tiradores', v: 'Ilimitados.' } ] }
      ] },
      { title: 'Atracos', blocks: [
        { t: 'ul', items: [
          'Un atraco dura como máximo 60 minutos. Si se supera, se cancela el rol: el botín se deja en el sitio y policía y atracadores olvidan lo ocurrido.',
          'La policía puede romper las negociaciones si los atracadores no tienen rehenes desde el principio.',
          'Solo en caso de tiroteo hay 10 segundos de tregua (contados en voz alta) para prepararse. Si la otra parte no valora su vida o la de los rehenes, se puede abrir fuego sin previo aviso (se sancionará forzar que la otra parte rompa las negociaciones).',
          'El tirador de la policía puede abatir al tirador de los atracadores sin romper las negociaciones, y viceversa.',
          'Los atracadores deben avisar SIEMPRE a la policía antes de robar o secuestrar, con /911 y una descripción de lo que se vería (si llegan en coche o andando, ropa, color del vehículo…).',
          'Los atracadores pueden pedir como máximo 3 minutos de ventaja para la huida.',
          'En atracos a locales puede ayudar un colaborador extra si la huida se ha pactado con la policía. Solo puede haber 1, que entorpezca el paso de la policía (valorando su vida) y que puede entrar en el tiroteo si la policía dispara primero. No cuenta como atracador.',
          'Un tirador que sube a un edificio ya no puede bajar, aunque sí puede pasar a los edificios de al lado.',
          'Siempre tiene que haber un policía más que atracadores.'
        ] },
        { t: 'h', text: 'Robo pequeño: coches, badulaque, lavandería, casa de cambio' },
        { t: 'kv', items: [
          { k: 'Atracadores', v: 'Máximo 5.' }, { k: 'Policías', v: 'Mínimo 2, máximo 4.' }, { k: 'Tiradores', v: '1 (cuenta como atracador y como policía de servicio).' },
          { k: 'Armas', v: 'Pistolas y armas cuerpo a cuerpo. Ambas partes llevan el mismo armamento, salvo que si los atracadores usan armas cuerpo a cuerpo la policía puede usar pistola.' },
          { k: 'Huida', v: 'Si al conseguir el botín no ha llegado la policía, los atracadores pueden huir sin esperar.' }
        ] },
        { t: 'h', text: 'Robo mediano: casas, contenedores, Fleeca Bank, Maze Bank' },
        { t: 'kv', items: [
          { k: 'Atracadores', v: 'Máximo 12.' }, { k: 'Policías', v: 'Mínimo 4, máximo 14.' }, { k: 'Tiradores', v: '1 (cuenta como atracador y como policía de servicio).' },
          { k: 'Armas', v: 'Todo tipo de armas para ambos bandos, excepto francotiradores.' }
        ] },
        { t: 'h', text: 'Robo mayor: Banco Central, casino, Pacific Bank, avión' },
        { t: 'kv', items: [
          { k: 'Quién', v: 'Evento autorizado solo para mafias y bandas.' },
          { k: 'Atracadores', v: 'Máximo 12.' }, { k: 'Policías', v: 'Mínimo 6, máximo 16.' }, { k: 'Tiradores', v: '2 (cuentan como atracadores y como policías de servicio).' },
          { k: 'Armas', v: 'Todo tipo de armas para ambos bandos, explosivos incluidos.' }
        ] },
        { t: 'h', text: 'Resumen de atracos' },
        { t: 'kv', items: [
          { k: 'Pequeño', v: 'Policías 2–4 · Atracadores 1–3 · Rehenes máx. 2 · Tiradores 1' },
          { k: 'Mediano', v: 'Policías 4–14 · Atracadores 1–5 · Rehenes máx. 3 · Tiradores 1' },
          { k: 'Mayor', v: 'Policías 6–16 · Atracadores 4–8 · Rehenes máx. 5 · Tiradores 2' }
        ] }
      ] },
      { title: 'Niveles de alerta (EAS)', blocks: [
        { t: 'p', text: 'El Emergency Alert System (EAS) mide el nivel de preparación y defensa de la policía. Se ajusta según el nivel de criminalidad de la ciudad.' },
        { t: 'h', text: 'Nivel 1 · Situación normal' },
        { t: 'ul', items: [
          'Actividad criminal muy baja. Se patrulla de forma habitual, sin armamento especial.',
          'Chaleco antibalas obligatorio en todo momento (no visible). Solo se pueden equipar las armas reglamentarias del grupo A.',
          'Cada binomio puede llevar un arma automática del grupo B en el maletero para responder a fuego automático, pero nunca encima.'
        ] },
        { t: 'h', text: 'Nivel 2 · Aumento de la delincuencia' },
        { t: 'ul', items: [
          'Aumentan los delitos en varios distritos. Se refuerzan los efectivos y el armamento policial.',
          'Se activa cuando hay varios focos de actividad criminal y uso de armamento automático, como múltiples secuestros o tiroteos en distintos puntos.',
          'Todos los agentes pueden llevar armas del grupo A, un arma del grupo B encima (una por patrulla) y ropa de operaciones especiales. Se permite 1 vehículo especial.'
        ] },
        { t: 'h', text: 'Nivel 3 · Amenaza grave' },
        { t: 'ul', items: [
          'Amenaza de gran magnitud: la ciudadanía debe quedarse en casa o en zonas seguras y se cierran los negocios.',
          'Quien incumpla el toque de queda será registrado, identificado y llevado a comisaría hasta que pase la alerta. Si lleva algo ilegal o tiene cuentas con la ley, será detenido.',
          'Se puede pedir apoyo militar (administración) para patrullar y resolver la alerta.',
          'Se activa, por ejemplo, por el secuestro de un alto cargo del Estado, atentados contra edificios públicos o federales o un descontrol total de la ciudadanía.',
          'Todos los agentes pueden llevar armas del grupo C y ropa de operaciones especiales. Se autorizan vehículos especiales y helicópteros.',
          'Prohibida la venta de drogas. Duración máxima: 30 minutos.'
        ] },
        { t: 'h', text: 'Nivel 4 · Evento oficial' },
        { t: 'note', text: 'La policía no está disponible por un evento oficial del staff. Están prohibidos los actos ilegales de cualquier tipo en toda la ciudad.' }
      ] },
      { title: 'Trabajos, multi PJ y peds', blocks: [
        { t: 'h', text: 'Trabajos' },
        { t: 'ul', items: [
          'Trabajos sin WL: no se puede iniciar un rol agresivo con alguien que está trabajando. Solo se le puede secuestrar durante los trayectos y sin campeo previo, y solo si trabaja con el vehículo de empresa.',
          'Bajo ningún concepto se pueden robar objetos de recompensa de trabajos, los tenga quien los tenga, salvo en zonas calientes.'
        ] },
        { t: 'h', text: 'Multi PJ' },
        { t: 'ul', items: [
          'Prohibido tener varios personajes con roles en común (hermanos, hijos, jefe y empleado, etc.).',
          'No se pueden tener personajes en facciones opuestas, como una banda y la policía, los bomberos o los servicios médicos.'
        ] },
        { t: 'h', text: 'Uso de peds' },
        { t: 'ul', items: [
          'Tu historia debe corresponder al ped que elijas. Si ya tenías uno, para cambiar de identidad tendrás que rotar el rol (CK).',
          'No se permite usar varios peds, salvo para probarlos al elegir tu personaje por primera vez (siempre en una casa o un lugar apartado).'
        ] },
        { t: 'note', text: 'El mal uso de peds conlleva un baneo mínimo de 2 semanas y la prohibición de usarlos en el futuro.' }
      ] }
    ];

    var BANDAS = [
      { title: 'Bandas', blocks: [
        { t: 'p', text: 'Una banda es un grupo organizado de 3 a 10 personas que no es una organización oficial, pero que se dedica de forma activa a cometer delitos por la ciudad.' },
        { t: 'h', text: 'Solicitud' },
        { t: 'p', text: 'Para solicitar una banda, el líder de la organización que la va a tutelar debe abrir un ticket en Discord presentando a sus miembros. Cualquier cambio en la banda se notificará a la administración.' },
        { t: 'h', text: 'Requisitos' },
        { t: 'ul', items: [
          'Entre 3 y 10 miembros.',
          'Al menos una semana en el servidor.',
          'Edad media de los integrantes de 16 años como mínimo.',
          'Todos los miembros identificados ante el staff (nombre IC, Discord y Steam).'
        ] },
        { t: 'h', text: 'Normativa' },
        { t: 'kv', items: [
          { k: '1', v: 'Las bandas deben respetar la normativa general.' },
          { k: '2', v: 'Las bandas no pueden colaborar con las organizaciones como miembros extra.' },
          { k: '3', v: 'Las bandas deben estar bajo la tutela de una organización oficial.' }
        ] },
        { t: 'h', text: 'Armas' },
        { t: 'kv', items: [
          { k: '4', v: 'Solo pueden hacer tratos con su organización asignada.' },
          { k: '5', v: 'Pueden llevar cualquier arma si tienen permiso de su organización.' }
        ] }
      ] },
      { title: 'Organizaciones ilegales', blocks: [
        { t: 'h', text: 'Requisitos' },
